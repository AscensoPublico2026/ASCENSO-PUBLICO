# Configuración para despliegue en Render.com
services:
  - type: worker
    name: monitor-cnsc
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py --loop
    envVars:
      - key: ALERT_EMAIL
        sync: false
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: CHECK_INTERVAL_MINUTES
        value: "60"
      - key: KEYWORDS
        sync: false
